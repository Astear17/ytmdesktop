---
name: Manual Build & Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
        default: 'manual-build'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [
            { name: 'linux',   image: 'ubuntu-latest' },
            { name: 'windows', image: 'windows-latest' },
            { name: 'macos',   image: 'macos-latest' }
          ]
        arch: [ 'x64', 'arm64' ]
      fail-fast: false

    runs-on: ${{ matrix.os.image }}

    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - name: Force HTTPS for GitHub
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Corepack Enable Yarn
        run: corepack enable yarn

      - name: Setup Node (v20)
        uses: actions/setup-node@v4
        with:
          cache: 'yarn'
          node-version: "20.x"

      - name: Install dependencies
        run: yarn --immutable

      - name: Read package version
        id: pkg
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version='+JSON.parse(require('fs').readFileSync('package.json','utf8')).version+'\n')"

      - name: Build (${{ matrix.arch }})
        env:
          YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY }}
          YTMD_RENAME_OS: ${{ matrix.os.name }}
          YTMD_RENAME_ARCH: ${{ matrix.arch }}
        run: yarn make --arch ${{ matrix.arch }}

      - name: Upload artifacts (Linux)
        if: matrix.os.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: YTMDesktop-Astear17_${{ steps.pkg.outputs.version }}_linux-${{ matrix.arch }}
          path: out/make/**

      - name: Upload artifacts (Windows)
        if: matrix.os.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: YTMDesktop-Astear17_${{ steps.pkg.outputs.version }}_windows-${{ matrix.arch }}
          path: out/make/**

      - name: Upload artifacts (macOS)
        if: matrix.os.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: YTMDesktop-Astear17_${{ steps.pkg.outputs.version }}_macos-${{ matrix.arch }}
          path: out/make/**

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts || dir /s artifacts

      - name: Release Build Resources
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: |
            artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
